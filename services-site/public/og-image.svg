<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Ultra premium dark background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="100%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#2a2010" />
      <stop offset="40%" stop-color="#0a0804" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Metallic Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ebd197" />
      <stop offset="50%" stop-color="#c59b41" />
      <stop offset="80%" stop-color="#f2d588" />
      <stop offset="100%" stop-color="#8a631c" />
    </linearGradient>

    <!-- Subtle mesh gradient orbs -->
    <radialGradient id="orb1" cx="0%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#b48c36" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b48c36" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="orb2" cx="100%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#e8c77b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e8c77b" stop-opacity="0" />
    </radialGradient>

    <!-- Fade gradients for elegant structural lines -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b48c36" stop-opacity="0" />
      <stop offset="50%" stop-color="#b48c36" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b48c36" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lineGradVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b48c36" stop-opacity="0" />
      <stop offset="50%" stop-color="#b48c36" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#b48c36" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="#050505" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  
  <!-- Subtle Orbs -->
  <rect width="1200" height="630" fill="url(#orb1)" />
  <rect width="1200" height="630" fill="url(#orb2)" />

  <!-- Minimalist Grid / Lines -->
  <rect x="0" y="315" width="1200" height="1.5" fill="url(#lineGrad)" opacity="0.6" />
  <rect x="600" y="0" width="1.5" height="630" fill="url(#lineGradVert)" opacity="0.6" />
  
  <!-- Geometric rings -->
  <circle cx="600" cy="315" r="280" fill="none" stroke="url(#goldText)" stroke-width="2" stroke-dasharray="6 12" opacity="0.4" />
  <circle cx="600" cy="315" r="410" fill="none" stroke="url(#goldText)" stroke-width="1.5" opacity="0.2" />

  <!-- Elegant Inner Border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="url(#goldText)" stroke-width="2" opacity="0.5" />
  
  <!-- Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="url(#goldText)" stroke-width="4" opacity="1" />
  <path d="M 1160 70 L 1160 40 L 1130 40" fill="none" stroke="url(#goldText)" stroke-width="4" opacity="1" />
  <path d="M 40 560 L 40 590 L 70 590" fill="none" stroke="url(#goldText)" stroke-width="4" opacity="1" />
  <path d="M 1160 560 L 1160 590 L 1130 590" fill="none" stroke="url(#goldText)" stroke-width="4" opacity="1" />

  <!-- Center Diamond Accents -->
  <rect x="594" y="34" width="12" height="12" fill="url(#goldText)" transform="rotate(45 600 40)" opacity="1"/>
  <rect x="594" y="584" width="12" height="12" fill="url(#goldText)" transform="rotate(45 600 590)" opacity="1"/>
  <rect x="34" y="309" width="12" height="12" fill="url(#goldText)" transform="rotate(45 40 315)" opacity="1"/>
  <rect x="1154" y="309" width="12" height="12" fill="url(#goldText)" transform="rotate(45 1160 315)" opacity="1"/>

  <!-- Typography Layout -->
  <!-- Top Label -->
  <text x="600" y="190" fill="#f2d588" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="8" text-anchor="middle" text-transform="uppercase">Premium Digital Company</text>
  
  <!-- Main Title -->
  <text x="600" y="320" fill="url(#goldText)" font-family="system-ui, -apple-system, sans-serif" font-size="124" font-weight="900" letter-spacing="-1" text-anchor="middle">SOFTGENZ</text>
  
  <!-- Subtitle -->
  <text x="600" y="405" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" letter-spacing="0" text-anchor="middle">Empowering brands with extraordinary digital experiences.</text>
  
  <!-- Services Pill -->
  <g transform="translate(110, 465)">
    <rect width="980" height="70" rx="35" fill="#18140c" stroke="url(#goldText)" stroke-width="2" opacity="0.9" />
    <text x="490" y="44" fill="#f2d588" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="3" text-anchor="middle" text-transform="uppercase">Website Development  •  Custom Software  •  SEO &amp; Marketing</text>
  </g>
</svg>
